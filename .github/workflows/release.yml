# Builds the release APK and publishes it as a GitHub Release.
# Owner setup and manual steps are documented in docs/WORKFLOW.md.
name: release

on:
  push:
    # Publish from the branch that carries the release code. Docs-only and README-only pushes do
    # not publish: a documentation change must not create a new release.
    branches: [ "lineage-23.2" ]
    paths-ignore:
      - "docs/**"
      - "**.md"
  # Lets the owner publish by hand from the Actions tab, for example after a fix to the script.
  workflow_dispatch:

# The only permission needed is writing the release and its tag. Everything else stays read-only.
permissions:
  contents: write

# Two publishes must not run at once: they would race on the same tag. A running publish is
# never cancelled, because stopping it half way could leave a tag without assets.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # A release build with the Gradle cache should finish well within this. The limit stops a
    # hung job from holding the concurrency group.
    timeout-minutes: 60
    env:
      # Keep the release gate on the build-tools this workflow installs; hosted images also
      # carry newer build-tools whose tool output can change.
      PINNED_BUILD_TOOLS_VERSION: "36.0.0"
    steps:
      # Full history, not the default depth 1: versionCode is the commit count, and a shallow
      # clone would give a smaller number. A shallow clone is rejected by Gradle and by the
      # script.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The Gradle build (AGP 8.13.2) runs on JDK 17; the repository debug workflow uses the
      # same major version.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      # aapt2 and apksigner come from build-tools. The gates in ci-build.sh need them to check
      # the package name, debuggable flag and signing certificate. Installing a pinned version
      # keeps the checks the same from run to run.
      - name: Install build-tools (aapt2, apksigner)
        run: |
          # Accept the SDK licences if they are not accepted yet. Failing here is not fatal:
          # the install below reports any real problem.
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;${PINNED_BUILD_TOOLS_VERSION}"

      # All release logic is in the script: decode the keystore, build, gate, write dist/. The
      # signing secrets are passed as environment variables, never as command-line arguments, so
      # they do not show in process lists. For compatibility, KEYSTORE_BASE64 falls back to the
      # KEYSTORE_FILE secret when KEYSTORE_BASE64 is empty; despite its name, that secret must
      # then contain the base64 keystore. GH_TOKEN lets the script read the previous release.
      # GitHub runners set CI=true, which ci-build.sh and build.gradle require.
      - name: Build, check and prepare release files
        id: build
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.KEYSTORE_FILE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Checkouts can lose the executable bit; set it again before running.
          chmod +x gradlew scripts/ci-build.sh
          scripts/ci-build.sh

      # Creates the tag at the built commit and uploads dist/: the APK, its .sha256 and
      # build-info.json (GKUI-Pack reads the fields from build-info.json). The body comes from
      # build/release-notes.md, which carries the package name, versionCode, signer
      # fingerprint, the source link, and the note that this key differs from the debug builds.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file build/release-notes.md
