name: build

runs:
    using: composite

    steps:
    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: 17
        cache: 'gradle'

    - name: Build with Gradle
      shell: bash
      run: |
        ./gradlew assembleDebug > gradle-build.log 2>&1
        status=$?
        if [ "$status" -ne 0 ]; then
          cat gradle-build.log
          echo "=== gradle failure surfaced as annotations ==="
          grep -E -m 20 'FAILURE:|What went wrong|Caused by:|error:|\.gradle:[0-9]+' gradle-build.log | while IFS= read -r line; do
            echo "::error::${line}"
          done
        fi
        exit $status

    - uses: actions/upload-artifact@v7
      with:
        name: DeskClock-debug.apk
        path: build/outputs/apk/debug/DeskClock-debug.apk
        archive: false
