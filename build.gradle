plugins {
    id("com.android.application") version "8.13.2" apply true
}

android {
    namespace 'com.android.deskclock'
    compileSdk 36

    defaultConfig {
        applicationId "com.android.deskclock"
        minSdkVersion 27
        targetSdkVersion 34
    }

    buildTypes {
        debug {
            applicationIdSuffix ".dev"
        }
        release {
            minifyEnabled true
            proguardFiles 'proguard.flags'
        }
    }

    sourceSets {
        main {
            res.srcDirs = ['res']
            java.srcDirs = ['src']
            assets.srcDirs = ['assets']
            manifest.srcFile 'AndroidManifest.xml'
        }

        test {
            java.srcDirs = ['tests']
            // The legacy AOSP UI tests (timer, uidata, worldclock, provider, ringtone) do not
            // compile or run on the JVM after this fork's UI rework (e.g. TimerPagerAdapter is
            // gone) and were never wired into CI. The alarm-test workflow targets the
            // workday/holiday policy matrix, so only those packages compile as unit tests
            // until the legacy tests are ported or removed.
            include 'com/android/deskclock/workdays/**'
            include 'com/android/deskclock/holiday/**'
        }
    }

    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        lintConfig = file("lint.xml")
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0-alpha09'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0-rc01'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.loader:loader:1.1.0'
    implementation 'androidx.test:core:1.5.0'
    implementation 'androidx.test:rules:1.5.0'
    testImplementation 'junit:junit:4.13.2'
    // android.jar's org.json classes are stubbed in local unit tests; the real implementation
    // is needed for HolidayDataParserTest (and the code it exercises) to run on the JVM.
    testImplementation 'org.json:json:20240303'
}

tasks.withType(JavaCompile) {
    options.compilerArgs << '-Xlint:unchecked'
//    options.deprecation = true
}
