plugins {
    id("com.android.application") version "8.13.2" apply true
}

// ---------------------------------------------------------------------------
// Release versioning and signing (see docs/WORKFLOW.md).
//
// versionCode is the number of commits in the checked-out history; it only
// grows, so every release is newer than the last. A shallow clone undercounts,
// so a release build refuses to start from one (taskGraph check below).
// versionName is yyyyMMdd.<versionCode>; the VERSION_NAME environment
// variable overrides it. Without git (a source archive) the build uses 1.
//
// Release signing comes only from environment variables
// (KEYSTORE_FILE/KEYSTORE_PASS/KEY_ALIAS/KEY_PASS), so ~/.gradle/gradle
// .properties is never read and a developer's local key cannot be used by CI
// by accident.
// ---------------------------------------------------------------------------

// CI runners set CI=true; scripts/ci-build.sh enforces it for release builds.
def isCi = System.getenv("CI") == "true"

// Runs git in the repository root. Returns trimmed stdout, or null when git fails.
String runGit(String... args) {
    try {
        def pb = new ProcessBuilder(["git"] + args.toList())
        pb.directory(rootDir)
        pb.redirectErrorStream(true)
        def process = pb.start()
        def out = process.inputStream.text.trim()
        return process.waitFor() == 0 ? out : null
    } catch (Exception ignored) {
        return null
    }
}

def isShallowClone = runGit("rev-parse", "--is-shallow-repository") == "true"
def commitCountText = runGit("rev-list", "--count", "HEAD")
int appVersionCode = 1
if (commitCountText != null && commitCountText.isInteger()) {
    def commitCount = commitCountText.toInteger()
    if (commitCount > 0) {
        appVersionCode = commitCount
    }
}

def versionNameOverride = System.getenv("VERSION_NAME")?.trim()
def appVersionName
if (versionNameOverride) {
    appVersionName = versionNameOverride
} else {
    def buildDate = java.time.LocalDate.now(java.time.ZoneOffset.UTC).format(java.time.format.DateTimeFormatter.ofPattern("yyyyMMdd"))
    appVersionName = buildDate + "." + appVersionCode
}

def releaseKeystorePath = System.getenv("KEYSTORE_FILE")?.trim()
def releaseKeystore = releaseKeystorePath ? new File(releaseKeystorePath) : null
def releaseStorePassword = System.getenv("KEYSTORE_PASS")
def releaseKeyAlias = System.getenv("KEY_ALIAS")
def releaseKeyPassword = System.getenv("KEY_PASS")
boolean hasStorePass = releaseStorePassword != null && !releaseStorePassword.isEmpty()
boolean hasKeyAlias = releaseKeyAlias != null && !releaseKeyAlias.isEmpty()
boolean hasKeyPass = releaseKeyPassword != null && !releaseKeyPassword.isEmpty()
boolean releaseSigningReady = releaseKeystore != null && releaseKeystore.isFile() && hasStorePass && hasKeyAlias && hasKeyPass

android {
    namespace 'com.android.deskclock'
    compileSdk 36

    defaultConfig {
        applicationId "com.android.deskclock"
        minSdkVersion 27
        targetSdkVersion 34
        versionCode appVersionCode
        versionName appVersionName
    }

    if (releaseSigningReady) {
        signingConfigs {
            release {
                storeFile releaseKeystore
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".dev"
        }
        release {
            minifyEnabled true
            proguardFiles 'proguard.flags'
            debuggable false
            // Release key when the environment provides it. Otherwise the debug key, for
            // local builds only: CI refuses to build a release without the release key
            // (taskGraph check below).
            signingConfig releaseSigningReady ? signingConfigs.release : signingConfigs.debug
        }
    }

    sourceSets {
        main {
            res.srcDirs = ['res']
            java.srcDirs = ['src']
            assets.srcDirs = ['assets']
            manifest.srcFile 'AndroidManifest.xml'
        }

        test {
            java.srcDirs = ['tests']
        }
    }

    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        lintConfig = file("lint.xml")
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0-alpha09'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.0-rc01'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1'
    implementation 'androidx.loader:loader:1.1.0'
    implementation 'androidx.test:core:1.5.0'
    implementation 'androidx.test:rules:1.5.0'
    testImplementation 'junit:junit:4.13.2'
}

// A release build must never be signed with the debug key in CI. Locally it falls back to the
// debug key with a warning, so development builds keep working without the release secrets.
// Only tasks that produce or sign a release package count; test tasks such as
// testReleaseUnitTest do not, so `./gradlew test` is not affected.
gradle.taskGraph.whenReady { graph ->
    def releaseTaskPrefixes = ["assemble", "bundle", "package", "validateSigning", "install"]
    def packagesRelease = graph.allTasks.any { task ->
        task.name.contains("Release") && releaseTaskPrefixes.any { task.name.startsWith(it) }
    }
    if (packagesRelease) {
        if (isCi && isShallowClone) {
            throw new GradleException("Release build refused: versionCode needs full git history (fetch-depth: 0).")
        }
        if (!releaseSigningReady) {
            def missing = "KEYSTORE_FILE (existing file), KEYSTORE_PASS, KEY_ALIAS, KEY_PASS"
            if (isCi) {
                throw new GradleException("Release build refused: signing environment incomplete. Need: " + missing)
            }
            logger.warn("WARNING: release signing environment incomplete (" + missing + "). Local release build is signed with the DEBUG key. Do not distribute it.")
        }
    }
}

tasks.withType(JavaCompile) {
    options.compilerArgs << '-Xlint:unchecked'
//    options.deprecation = true
}
